          python3 -m unittest discover -s tests -p 'test_p016_health.py' -v 2>&1 | tee build/p017/p016-cli-tests.txt
          python3 -m unittest discover -s tests -p 'test_p015_policy_cli.py' -v 2>&1 | tee build/p017/p015-cli-tests.txt
          python3 -m unittest discover -s tests -p 'test_p009_evidence.py' -v 2>&1 | tee build/p017/p009-tests.txt
          python3 -m unittest discover -s tests -p 'test_p011_preflight.py' -v 2>&1 | tee build/p017/p011-tests.txt
          python3 -m unittest discover -s tests -p 'test_p012_research.py' -v 2>&1 | tee build/p017/p012-tests.txt
          python3 -m unittest discover -s tests -p 'test_p013_service.py' -v 2>&1 | tee build/p017/p013-tests.txt
          python3 -m unittest discover -s tests/packaging -p 'test_p010_signing.py' -v 2>&1 | tee build/p017/p010-tests.txt
          python3 -m unittest discover -s tests/packaging -p 'test_rootful_package.py' -v 2>&1 | tee build/p017/package-tests.txt
      - name: Verify scheduler has no process-global timezone or execution side effects
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          schedule = Path("src/schedule.c").read_text(encoding="utf-8")
          daemon = Path("src/daemon.c").read_text(encoding="utf-8")
          cli = Path("src/cli.c").read_text(encoding="utf-8")
          forbidden_schedule = ("setenv(", "unsetenv(", "tzset(", "mktime(",
                                "IOKit", "launchctl", "socket(", "connect(",
                                "fork(", "execv(", "system(")
          found = [item for item in forbidden_schedule if item in schedule]
          if found:
              raise SystemExit("schedule recurrence contains forbidden side effects: " + ",".join(found))
          if "schedule_store_evaluate(" in daemon or "check_and_trigger_schedules" in daemon:
              raise SystemExit("daemon still has an automatic schedule execution path")
          # Anchor the implementation, not its forward declaration. Other CLI
          # helpers may execute bounded read-only diagnostics before this block.
          diagnostics = cli.split(
              "static int schedule_diagnostics_command(int argc, char **argv, const char *socket_path,", 1
          )[1].split(
              "static int schedule_cli_load_store", 1
          )[0]
          forbidden_cli = ("system(", "popen(", "execv(", "launchctl", "START ", "PROBE\\n")
          found = [item for item in forbidden_cli if item in diagnostics]
          if found:
              raise SystemExit("read-only schedule diagnostics contain an activation path: " + ",".join(found))
          print("schedule timezone and side-effect boundary: PASS")
          PY
      - name: Write deterministic exact-source validation evidence
        env:
          P017_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          P009_RESULT: ${{ needs.p009-evidence-validation.result }}
          P010_RESULT: ${{ needs.p010-signing-release-gate.result }}
          P011_RESULT: ${{ needs.p011-release-preflight.result }}
          P012_RESULT: ${{ needs.p012-idle-research-validation.result }}
          P013_RESULT: ${{ needs.p013-launchd-lifecycle-validation.result }}
          P014_RESULT: ${{ needs.p014-crash-recovery-validation.result }}
          P015_RESULT: ${{ needs.p015-server-policy-validation.result }}
          P016_RESULT: ${{ needs.p016-health-telemetry-validation.result }}
          IOS_BUILD_RESULT: ${{ needs.ios-cross-build.result }}
          MACHO_RESULT: ${{ needs.ios-artifact-inspection.result }}
          PACKAGE_RESULT: ${{ needs.ios-rootful-package.result }}
          LINUX_RESULT: ${{ needs.linux-protocol.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path("build/p017")
          source_sha = os.environ["P017_SOURCE_SHA"]
          if (root / "source-commit.txt").read_text().strip() != source_sha:
              raise SystemExit("P017 report SHA differs from checked-out source")

          def native(filename, pattern, label):
              match = re.search(pattern, (root / filename).read_text())
              if not match:
                  raise SystemExit(f"{label} native suite did not report success")
              return {"checks": int(match.group(1)), "result": "PASS"}

          def python_suite(filename, label):
              content = (root / filename).read_text()
              match = re.search(r"Ran (\d+) tests? in ", content)
              if not match or "\nOK\n" not in content:
                  raise SystemExit(f"{label} suite did not pass")
              return {"tests": int(match.group(1)), "result": "PASS"}

          upstream = {
              name: os.environ[variable]
              for name, variable in (
                  ("linux_protocol", "LINUX_RESULT"), ("ios_arm64_cross_build", "IOS_BUILD_RESULT"),
                  ("macho_inspection", "MACHO_RESULT"), ("rootful_package", "PACKAGE_RESULT"),
                  ("p009", "P009_RESULT"), ("p010", "P010_RESULT"),
                  ("p011", "P011_RESULT"), ("p012", "P012_RESULT"),
                  ("p013", "P013_RESULT"), ("p014", "P014_RESULT"),
                  ("p015", "P015_RESULT"), ("p016", "P016_RESULT"),
              )
          }
          if any(result != "success" for result in upstream.values()):
              raise SystemExit("an upstream P009–P016/build CI gate did not succeed")

          suites = {
              "p017_c11_recurrence_dst_conflict_storage": native(
                  "schedule-tests.txt", r"P017 scheduling checks: (\d+) passed", "P017 schedule"
              ),
              "p014_recovery_blocking": native(
                  "p014-tests.txt", r"P014 recovery policy and persistence checks: (\d+) passed", "P014"
              ),
              "p013_lifecycle": native(
                  "p013-native-tests.txt", r"P013 native service checks: (\d+) passed", "P013"
              ),
              "p015_unattended_policy_denial": native(
                  "p015-tests.txt", r"P015 policy/schema/filesystem checks: (\d+) passed", "P015"
              ),
              "p016_unknown_stale_telemetry": native(
                  "p016-tests.txt", r"P016 health/native checks: (\d+) passed", "P016"
              ),
              "p017_cli_storage_and_mutation_previews": python_suite("cli-tests.txt", "P017 CLI"),
              "p016_cli_compatibility": python_suite("p016-cli-tests.txt", "P016 CLI"),
              "p015_cli_compatibility": python_suite("p015-cli-tests.txt", "P015 CLI"),
              "p009_evidence_compatibility": python_suite("p009-tests.txt", "P009"),
              "p011_preflight": python_suite("p011-tests.txt", "P011"),
              "p012_idle_research": python_suite("p012-tests.txt", "P012"),
              "p013_service_cli": python_suite("p013-tests.txt", "P013 CLI"),
              "p010_signing": python_suite("p010-tests.txt", "P010"),
              "rootful_package_regression": python_suite("package-tests.txt", "package"),
              "linux_protocol_and_missed_restart_integration": {"result": "PASS"},
              "no_launchd_or_device_side_effects": {"result": "PASS"},
              "legacy_schedule_preservation": {"result": "PASS"},
          }
          document = {
              "manifest_version": 1,
              "milestone": "P017",
              "status": "P017_CLOUD_COMPLETE_DEVICE_SCHEDULING_PENDING",
              "branch": "ios/p017-scheduling-v2",
              "source_sha": source_sha,
              "validation_class": "SIMULATED_AND_MOCK_ONLY",
              "upstream_gate_results": upstream,
              "suites": suites,
              "schedule_executor": "NOT_AUTHORIZED_BY_P015",
              "legacy_schedule_data": "PRESERVED_SCHEMA_V1_NO_PACKAGE_MIGRATION",
              "legacy_execution_change": "AUTOMATIC_P004_EXECUTION_SUPPRESSED",
              "maximum_new_schedule_seconds": 300,
              "launchd_mutation": "NOT_PERFORMED",
              "real_iokit_assertions": "NOT_ACQUIRED",
              "network_probes": "NOT_PERFORMED",
              "scheduled_wake": "UNVERIFIED",
              "device_acceptance": "PENDING",
          }
          (root / "P017-VALIDATION.json").write_text(
              json.dumps(document, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          lines = [
              f"status={document['status']}",
              f"source_sha={source_sha}",
              f"validation_class={document['validation_class']}",
              f"schedule_executor={document['schedule_executor']}",
              f"legacy_schedule_data={document['legacy_schedule_data']}",
              f"legacy_execution_change={document['legacy_execution_change']}",
              f"launchd_mutation={document['launchd_mutation']}",
              f"real_iokit_assertions={document['real_iokit_assertions']}",
              f"scheduled_wake={document['scheduled_wake']}",
              f"device_acceptance={document['device_acceptance']}",
          ]
          (root / "P017-VALIDATION.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-P017-scheduling-validation
          if-no-files-found: error
          path: |
            build/p017/P017-VALIDATION.json
            build/p017/P017-VALIDATION.txt
            build/p017/source-commit.txt
            build/p017/schedule-tests.txt
            build/p017/cli-tests.txt
            build/p017/integration-tests.txt
            build/p017/p014-tests.txt
            build/p017/p013-native-tests.txt
            build/p017/p015-tests.txt
            build/p017/p016-tests.txt
            build/p017/p016-cli-tests.txt
            build/p017/p015-cli-tests.txt
            build/p017/p009-tests.txt
            build/p017/p011-tests.txt
            build/p017/p012-tests.txt
            build/p017/p013-tests.txt
            build/p017/p010-tests.txt
            build/p017/package-tests.txt

  p018-cli-package-ux-validation:
    name: P018 CLI, package, and evidence validation
    runs-on: ubuntu-latest
    needs:
      - linux-protocol
      - ios-cross-build
      - ios-artifact-inspection
      - ios-rootful-package
      - p009-evidence-validation
      - p011-release-preflight
      - p010-signing-release-gate
      - p012-idle-research-validation
      - p013-launchd-lifecycle-validation
      - p014-crash-recovery-validation
      - p015-server-policy-validation
      - p016-health-telemetry-validation
      - p017-scheduling-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record and verify exact checked-out source SHA
        env:
          P018_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p build/p018
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$P018_SOURCE_SHA"
          printf '%s\n' "$actual_sha" | tee build/p018/source-commit.txt
      - name: Build the explicit C11 mock target
        run: ./scripts/build-linux-test.sh
      - name: Install zsh for interactive-shell syntax validation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh
      - name: Run CLI, error, package-preflight, and evidence-export regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee build/p018/python-tests.txt
          python3 -m unittest discover -s tests/packaging -v 2>&1 | tee build/p018/packaging-tests.txt
          python3 tests/integration.py 2>&1 | tee build/p018/protocol-integration.txt
      - name: Run root-owned export tests in isolated temporary directories
        run: |
          set -euo pipefail
          sudo python3 -m unittest \
            tests.test_p018_export.P018EvidenceInventoryTests.test_opt_in_operator_files_are_untrusted_and_sensitive_ids_are_rejected \
            tests.test_p018_export.P018EvidenceInventoryTests.test_interrupted_export_removes_partial_bundle -v \
            2>&1 | tee build/p018/root-export-tests.txt
      - name: Check POSIX shell and zsh documentation examples
        run: |
          set -euo pipefail
          command -v zsh
          python3 scripts/check_p018_docs_shell.py | tee build/p018/shell-examples.txt
          sh -n packaging/rootful/manager
          sh -n packaging/rootful/DEBIAN/preinst
          sh -n packaging/rootful/DEBIAN/prerm
      - name: Verify P013–P017 and package-script safety gates
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee build/p018/safety-gates.txt
          import re
          from pathlib import Path

          manager = Path("packaging/rootful/manager").read_text()
          preinst = Path("packaging/rootful/DEBIAN/preinst").read_text()
          prerm = Path("packaging/rootful/DEBIAN/prerm").read_text()
          cli = Path("src/cli.c").read_text()
          service = Path("src/service.c").read_text()
          daemon = Path("src/daemon.c").read_text()
          schedule = Path("src/schedule.c").read_text()
          server_policy = Path("src/server_policy.c").read_text()
          forbidden_manager = re.compile(r"\bdpkg\s+(?:-i|--remove)\b|\blaunchctl\s+(?:load|bootstrap|enable|kickstart|start|restart|bootout)\b|\bkill\s+-9\b|\brm\s+-rf\b", re.I)
          for name, text in (("manager", manager), ("preinst", preinst), ("prerm", prerm)):
              if forbidden_manager.search(text):
                  raise SystemExit(f"unsafe package mutation found in {name}")
          doctor = cli.split("static int doctor_command", 1)[1].split("static int package_status_json", 1)[0]
          if any(token in doctor for token in ("power_acquire", "PROBE\\n", "launchctl load", "system(", "execv(")):
              raise SystemExit("read-only doctor contains an acquisition or mutation path")
          for required in ("launchd.mutating_compatibility=UNVERIFIED", "automatic_restart=no",
                           "SCHEDULE_EXECUTOR_NOT_AUTHORIZED", "schedule.execution=BLOCKED_POLICY"):
              source = service + cli + daemon + schedule + server_policy
              if required not in source:
                  raise SystemExit(f"safety gate missing: {required}")
          print("p013_launchd_mutation=UNVERIFIED_FAIL_CLOSED")
          print("p014_automatic_restart=NO")
          print("p015_unattended_execution=NOT_AUTHORIZED")
          print("p017_schedule_executor=NOT_AUTHORIZED")
          print("package_install_remove_rollback=NOT_EXECUTED")
          PY
          test "$(git rev-parse HEAD)" = "$(cat build/p018/source-commit.txt)"
      - name: Exercise real export creation with isolated MOCK-only sources
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/p018-export-test"
          mkdir -p "$tmp/source/scripts" "$tmp/source/docs/evidence" "$tmp/evidence/p011" "$tmp/output"
          cp scripts/p018_evidence.py scripts/p018_validate_export.py "$tmp/source/scripts/"
          cat > "$tmp/source/docs/evidence/P010-OPERATOR-REPORTED.json" <<'JSON'
          {"schema_version":1,"record_type":"p018-export-fixture","evidence_origin":"MOCK","review_status":"UNREVIEWED","fixture_kind":"CI_ONLY","hardware_evidence_accepted":"NOT_ESTABLISHED"}
          JSON
          cat > "$tmp/evidence/p011/package-acceptance.json" <<'JSON'
          {"schema_version":1,"record_type":"p018-export-fixture","evidence_origin":"MOCK","review_status":"UNREVIEWED","fixture_kind":"CI_ONLY","hardware_evidence_accepted":"NOT_ESTABLISHED"}
          JSON
          sudo chown -R root:root "$tmp/source" "$tmp/evidence" "$tmp/output"
          sudo chmod 755 "$tmp/source" "$tmp/source/scripts" "$tmp/source/docs" "$tmp/source/docs/evidence"
          sudo chmod 644 "$tmp/source/scripts/p018_evidence.py" "$tmp/source/scripts/p018_validate_export.py" "$tmp/source/docs/evidence/P010-OPERATOR-REPORTED.json"
          sudo chmod 755 "$tmp/evidence/p011"
          sudo chmod 644 "$tmp/evidence/p011/package-acceptance.json"
          source_sha="$(git rev-parse HEAD)"
          sudo python3 "$tmp/source/scripts/p018_evidence.py" export --output "$tmp/output/bundle" --root "$tmp/evidence" --json | tee build/p018/root-export.json
          sudo python3 "$tmp/source/scripts/p018_validate_export.py" "$tmp/output/bundle" --json | tee build/p018/root-export-validation.json
          grep -q '"hardware_evidence_accepted":"NOT_ESTABLISHED"' build/p018/root-export-validation.json
          sudo grep -q '"provenance":"MOCK"' "$tmp/output/bundle/manifest.json"
          sudo cp -a "$tmp/output/bundle" build/p018/export-created
          sudo chown -R "$(id -u):$(id -g)" build/p018/export-created
          python3 scripts/p018_validate_export.py build/p018/export-created --json | tee build/p018/copied-export-validation.json
          python3 tests/create_p018_fixture_bundle.py --output "$RUNNER_TEMP/p018-deterministic-fixture" --source-sha "$source_sha" | tee build/p018/deterministic-fixture.txt
          python3 scripts/p018_validate_export.py "$RUNNER_TEMP/p018-deterministic-fixture" --json | tee build/p018/deterministic-fixture-validation.json
      - name: Write P018 exact-source validation summary
        env:
          P018_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path("build/p018")
          source_sha = os.environ["P018_SOURCE_SHA"]
          if (root / "source-commit.txt").read_text().strip() != source_sha:
              raise SystemExit("P018 validation artifact SHA mismatch")
          suites = {}
          for key, filename in (("python", "python-tests.txt"),
                                ("packaging", "packaging-tests.txt")):
              text = (root / filename).read_text()
              count = re.search(r"Ran (\d+) tests? in ", text)
              if not count or not re.search(r"^OK(?: \(skipped=\d+\))?$", text, re.MULTILINE):
                  raise SystemExit(f"{key} suite did not pass")
              suites[key] = {"tests": int(count.group(1)), "result": "PASS"}
          summary = {
              "manifest_version": 1,
              "milestone": "P018",
              "source_sha": source_sha,
              "status": "P018_CLOUD_COMPLETE_DEVICE_UX_PENDING",
              "validation_scope": "C11_MOCK_PYTHON_STANDARD_LIBRARY_POSIX_SH_ZSH_SYNTAX",
              "upstream_p009_p017": "PASS",
              "suites": suites,
              "package_install_remove_rollback": "NOT_EXECUTED",
              "launchd_mutation": "NOT_PERFORMED",
              "daemon_start": "NOT_PERFORMED",
              "assertion_acquisition": "NOT_PERFORMED",
              "device_access": "NOT_PERFORMED",
              "export_fixture_provenance": "MOCK_ONLY",
              "hardware_evidence_accepted": "NOT_ESTABLISHED",
          }
          (root / "P018-VALIDATION.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-P018-CLI-Package-Evidence-Validation
          if-no-files-found: error
          path: |
            build/p018/source-commit.txt
            build/p018/P018-VALIDATION.json
            build/p018/python-tests.txt
            build/p018/packaging-tests.txt
            build/p018/root-export-tests.txt
            build/p018/protocol-integration.txt
            build/p018/shell-examples.txt
            build/p018/safety-gates.txt
            build/p018/root-export.json
            build/p018/root-export-validation.json
            build/p018/copied-export-validation.json
            build/p018/export-created/**
            build/p018/deterministic-fixture.txt
            build/p018/deterministic-fixture-validation.json

  p019-supervised-reliability-validation:
    name: P019 supervised reliability and acceptance validation
    runs-on: ubuntu-latest
    needs:
      - linux-protocol
      - ios-cross-build
      - ios-artifact-inspection
      - ios-rootful-package
      - p009-evidence-validation
      - p011-release-preflight
      - p010-signing-release-gate
      - p012-idle-research-validation
      - p013-launchd-lifecycle-validation
      - p014-crash-recovery-validation
      - p015-server-policy-validation
      - p016-health-telemetry-validation
      - p017-scheduling-validation
      - p018-cli-package-ux-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record and verify exact checked-out source SHA
        env:
          P019_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p build/p019
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$P019_SOURCE_SHA"
          printf '%s\n' "$actual_sha" | tee build/p019/source-commit.txt
      - name: Validate preregistered P019 protocol and strict schemas
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/p019_session.py tests/p019_fixtures.py tests/test_p019_session.py
          python3 scripts/p019_session.py plan --format json > build/p019/plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          import p012_common
          protocol = json.loads(Path("experiments/p019/protocol-v1.json").read_text())
          schema = json.loads(Path("experiments/p019/protocol-v1.schema.json").read_text())
          for path in ("experiments/p019/session-v1.schema.json", "experiments/p019/acceptance-result-v1.schema.json"):
              value = json.loads(Path(path).read_text())
              assert isinstance(value.get("$id"), str), path
          issues = p012_common.validate_json_schema(protocol, schema)
          if issues:
              raise SystemExit("P019 protocol schema failed: " + "; ".join(issues))
          plan = json.loads(Path("build/p019/plan.json").read_text())
          assert plan["cloud_only"] is True and plan["device_actions_started"] is False
          assert plan["p012_matrix"]["planned_probe_trials"] == 24
          assert plan["p012_matrix"]["maximum_hold_seconds"] == 300
          PY
      - name: Run P019 fault, safety, evidence, and side-effect-boundary tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p 'test_p019_session.py' -v 2>&1 | tee build/p019/p019-tests.txt
      - name: Run P009, P012, and P018 evidence compatibility suites
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_p009_evidence.py' -v 2>&1 | tee build/p019/p009-compatibility-tests.txt
          python3 -m unittest discover -s tests -p 'test_p012_research.py' -v 2>&1 | tee build/p019/p012-compatibility-tests.txt
          python3 -m unittest discover -s tests -p 'test_p018_export.py' -v 2>&1 | tee build/p019/p018-export-compatibility-tests.txt
      - name: Generate and analyze deterministic SIMULATED-only session
        env:
          P019_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tests/create_p019_simulation_artifacts.py --source-sha "$P019_SOURCE_SHA" --output-dir build/p019/simulation
          python3 scripts/p019_session.py validate --session build/p019/simulation/session-simulated.json > build/p019/simulation/validation.json
          python3 scripts/p019_session.py analyze --session build/p019/simulation/session-simulated.json > build/p019/simulation/analysis.json
          python3 scripts/p019_session.py report --session build/p019/simulation/session-simulated.json --format markdown > build/p019/simulation/report.md
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("build/p019/simulation")
          source = os.environ["P019_SOURCE_SHA"]
          session = json.loads((root / "session-simulated.json").read_text())
          validation = json.loads((root / "validation.json").read_text())
          analysis = json.loads((root / "analysis.json").read_text())
          summary = json.loads((root / "SIMULATED-ONLY.json").read_text())
          assert session["source_commit_sha"] == source
          assert session["evidence_class"] == "SIMULATED"
          assert all(row["evidence_origin"] == "SIMULATED" for row in session["trial_records"])
          assert all(row["source_class"] == "SIMULATED" for row in session["bounded_cycles"])
          assert validation["session_validation"] == "PASS"
          assert validation["hardware_acceptance"] == "NOT_ESTABLISHED"
          assert analysis["status"] == "PREREQUISITES_BLOCKED"
          assert analysis["hardware_acceptance"] == "NOT_ESTABLISHED"
          assert analysis["source_commit_sha"] == source
          assert summary["fixture_provenance"] == "SIMULATED"
          assert summary["hardware_acceptance"] == "NOT_ESTABLISHED"
          assert summary["device_actions"] == "NOT_PERFORMED"
          (root / "P019-CI-SUMMARY.json").write_text(json.dumps({
              "manifest_version": 1,
              "milestone": "P019",
              "source_sha": source,
              "cloud_status": "P019_CLOUD_COMPLETE_HARDWARE_ACCEPTANCE_PENDING",
              "fixture_provenance": "SIMULATED_ONLY",
              "simulated_analysis_decision": analysis["status"],
              "hardware_acceptance": "NOT_ESTABLISHED",
              "physical_device_execution": "NOT_PERFORMED",
              "exact_source_sha_verified": True,
          }, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Confirm no device execution and exact source is unchanged
        env:
          P019_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P019_SOURCE_SHA"
          test "$(cat build/p019/source-commit.txt)" = "$P019_SOURCE_SHA"
          ! rg -n 'DEVICE_REPORTED|EXTERNAL_OBSERVER' build/p019/simulation
          grep -q '"hardware_acceptance": "NOT_ESTABLISHED"' build/p019/simulation/P019-CI-SUMMARY.json
          grep -q '"device_actions": "NOT_PERFORMED"' build/p019/simulation/SIMULATED-ONLY.json
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-P019-SIMULATED-Cloud-Validation
          if-no-files-found: error
          path: |
            build/p019/source-commit.txt
            build/p019/plan.json
            build/p019/p019-tests.txt
            build/p019/p009-compatibility-tests.txt
            build/p019/p012-compatibility-tests.txt
            build/p019/p018-export-compatibility-tests.txt
            build/p019/simulation/**

  p020-candidate-cross-build:
    name: P020 isolated unsigned v0.2 candidate cross-builds
    runs-on: macos-latest
    needs: [ios-cross-build]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and build two isolated unsigned candidates
        env:
          P020_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IOSCAFFEINATE_PACKAGE_VERSION: 0.2.0~rc1-1
        run: |
          set -euo pipefail
          mkdir -p dist/p020-first dist/p020-second
          test "$(git rev-parse HEAD)" = "$P020_SOURCE_SHA"
          IOSCAFFEINATE_OUTPUT_DIR="$GITHUB_WORKSPACE/dist/p020-first" ./scripts/build-macos.sh
          git worktree add --detach "$RUNNER_TEMP/p020-independent-source" "$P020_SOURCE_SHA"
          IOSCAFFEINATE_OUTPUT_DIR="$GITHUB_WORKSPACE/dist/p020-second" \
            "$RUNNER_TEMP/p020-independent-source/scripts/build-macos.sh"
          for directory in dist/p020-first dist/p020-second; do
            test "$(jq -r .source_commit_sha "$directory/build-info.json")" = "$P020_SOURCE_SHA"
            test "$(jq -r .package_version "$directory/build-info.json")" = '0.2.0~rc1-1'
            test "$(jq -r .signing_status "$directory/build-info.json")" = 'UNSIGNED'
            (cd "$directory" && shasum -a 256 -c SHA256SUMS)
            python3 scripts/inspect-ios.py --directory "$directory" | tee "$directory/inspection.txt"
          done
          test "$(git -C "$RUNNER_TEMP/p020-independent-source" status --porcelain)" = ''
          test "$(git status --porcelain --untracked-files=no)" = ''
          git worktree remove --force "$RUNNER_TEMP/p020-independent-source"
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-P020-v0.2.0-rc1-UNSIGNED-DEVICE-UNVERIFIED
          if-no-files-found: error
          path: |
            dist/p020-first/ios-caffeinate
            dist/p020-first/ios-caffeinated
            dist/p020-first/SHA256SUMS
            dist/p020-first/build-info.json
            dist/p020-first/inspection.txt
            dist/p020-second/ios-caffeinate
            dist/p020-second/ios-caffeinated
            dist/p020-second/SHA256SUMS
            dist/p020-second/build-info.json
            dist/p020-second/inspection.txt

  p020-release-readiness-validation:
    name: P020 release readiness validation
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: read
      pull-requests: read
      actions: read
    needs:
      - p008-release-attestation
      - linux-protocol
      - ios-cross-build
      - ios-artifact-inspection
      - ios-rootful-package
      - p009-evidence-validation
      - p011-release-preflight
      - p010-signing-release-gate
      - p012-idle-research-validation
      - p013-launchd-lifecycle-validation
      - p014-crash-recovery-validation
      - p015-server-policy-validation
      - p016-health-telemetry-validation
      - p017-scheduling-validation
      - p018-cli-package-ux-validation
      - p019-supervised-reliability-validation
      - p020-candidate-cross-build
    env:
      P020_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      P020_LINUX: ${{ needs.linux-protocol.result }}
      P020_IOS_CROSS: ${{ needs.ios-cross-build.result }}
      P020_IOS_INSPECTION: ${{ needs.ios-artifact-inspection.result }}
      P020_PACKAGE: ${{ needs.ios-rootful-package.result }}
      P020_P009: ${{ needs.p009-evidence-validation.result }}
      P020_P011: ${{ needs.p011-release-preflight.result }}
      P020_P010: ${{ needs.p010-signing-release-gate.result }}
      P020_P012: ${{ needs.p012-idle-research-validation.result }}
      P020_P013: ${{ needs.p013-launchd-lifecycle-validation.result }}
      P020_P014: ${{ needs.p014-crash-recovery-validation.result }}
      P020_P015: ${{ needs.p015-server-policy-validation.result }}
      P020_P016: ${{ needs.p016-health-telemetry-validation.result }}
      P020_P017: ${{ needs.p017-scheduling-validation.result }}
      P020_P018: ${{ needs.p018-cli-package-ux-validation.result }}
      P020_P019: ${{ needs.p019-supervised-reliability-validation.result }}
      P020_CANDIDATE_CROSS: ${{ needs.p020-candidate-cross-build.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Caffeinate-P019-SIMULATED-Cloud-Validation
          path: build/p019
      - name: Record and verify exact checked-out source SHA
        run: |
          set -euo pipefail
          mkdir -p build/p020
          test "$(git rev-parse HEAD)" = "$P020_SOURCE_SHA"
          git merge-base --is-ancestor 7d5723fca2595b8928ed3e1717ca872906d48538 "$P020_SOURCE_SHA"
          git rev-parse HEAD > build/p020/source-commit.txt
          git rev-parse 'HEAD^{tree}' > build/p020/source-tree.txt
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Validate current P011 through P019 PR dependency chain
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          P020_CURRENT_PR: ${{ github.event.pull_request.number || '' }}
          P020_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("scripts").resolve()))
          from h003_stack import StackValidationError, validate_h003_stack

          repo = os.environ["GITHUB_REPOSITORY"]
          expected = [
              (10, "P011", "ios/p011-signed-package-acceptance", "1fed3d15f44099d4f862ac1ff422da287b78b0b3", "main", "0cfdc645dc1d67ddc4320a00bb114763b9669b66", "16f3ea06e2c100bc1caa208f5d539bb9620222c0"),
              (11, "P012", "ios/p012-controlled-idle-power-research", "f459e332deefb134b6725c1455c5721830d0bb3a", "main", "16f3ea06e2c100bc1caa208f5d539bb9620222c0", "50f96891b8369583c7b86576bd198854283edc0c"),
              (12, "P013", "ios/p013-launchd-lifecycle", "3d7b5d4c700194ab71713c51577e7a7cf0acd48c", "main", "50f96891b8369583c7b86576bd198854283edc0c", "077b62bcf167a7b54ddf6f56c8bd3895c4f2da19"),
              (13, "P014", "ios/p014-crash-recovery", "5dbf08176f3219c082e5b8f48bac43461b3fdd96", "main", "077b62bcf167a7b54ddf6f56c8bd3895c4f2da19", "4abecae5ce4baf69de159b648fb07a9e0ff8a446"),
              (14, "P015", "ios/p015-server-mode-v2", "ef46cdc467128bf658c81dc891915aa91a2ddbca", "main", "4abecae5ce4baf69de159b648fb07a9e0ff8a446", "938c7c87f84090ecebbe2e2bbb9e8116f263e5be"),
              (15, "P016", "ios/p016-health-telemetry", "1b0e258b136f6325c4720bf55c569449935418c3", "main", "938c7c87f84090ecebbe2e2bbb9e8116f263e5be", "12228ac832f77243e4d87c5a0178208cf3f3eef6"),
              (16, "P017", "ios/p017-scheduling-v2", "15861c0f9b765731c7dee506fd147ca7e53cbf7e", "main", "12228ac832f77243e4d87c5a0178208cf3f3eef6", "84277473bbbad2c2d2df977f559840f13db6c25b"),
              (17, "P018", "ios/p018-cli-package-ux", "e9d94c9abdfb63ccabd96e11ea2f667c33918e90", "main", "84277473bbbad2c2d2df977f559840f13db6c25b", "9083f9265ddcb0cc9f6c75edce0e0c473d74897b"),
              (18, "P019", "ios/p019-supervised-reliability", "7d5723fca2595b8928ed3e1717ca872906d48538", "main", "9083f9265ddcb0cc9f6c75edce0e0c473d74897b", "7dbd47e4500c0ddf3d65d282d8e6a8881d6c8703"),
          ]
          pulls = json.loads(subprocess.run(
              ["gh", "api", f"repos/{repo}/pulls?state=all&per_page=100"],
              check=True, capture_output=True, text=True).stdout)
          by_number = {item["number"]: item for item in pulls}
          records = []
          for number, milestone, branch, head, base_branch, base_sha, merge_sha in expected:
              item = by_number.get(number)
              if item is None:
                  raise SystemExit(f"missing {milestone} PR #{number}")
              state = "MERGED" if item.get("merged_at") else item["state"].upper()
              if item["head"]["ref"] != branch or item["head"]["sha"] != head:
                  raise SystemExit(f"{milestone} PR #{number} head differs from the verified chain")
              if item["base"]["ref"] != base_branch:
                  raise SystemExit(f"{milestone} PR #{number} base branch differs from the verified chain")
              if item["base"]["sha"] != base_sha:
                  raise SystemExit(f"{milestone} PR #{number} base SHA differs from the verified chain")
              if state != "MERGED" or item.get("merge_commit_sha") != merge_sha:
                  raise SystemExit(f"{milestone} PR #{number} merge commit differs from the verified integration DAG")
              if state not in ("OPEN", "MERGED"):
                  raise SystemExit(f"{milestone} PR #{number} is {state}")
              mergeable = item.get("mergeable")
              mergeability = "UNKNOWN" if state == "MERGED" else "MERGEABLE" if mergeable is True else "CONFLICTING" if mergeable is False else "UNKNOWN"
              view = json.loads(subprocess.run(
                  ["gh", "pr", "view", str(number), "--repo", repo, "--json", "reviewDecision,statusCheckRollup"],
                  check=True, capture_output=True, text=True).stdout)
              checks = view.get("statusCheckRollup") or []
              failed = []
              pending = []
              for check in checks:
                  name = check.get("name") or check.get("context") or "unknown"
                  conclusion = check.get("conclusion") or check.get("state") or check.get("status")
                  if conclusion in ("SUCCESS", "success"):
                      continue
                  if conclusion in ("SKIPPED", "skipped") and name == "p008-release-attestation":
                      continue
                  if conclusion in ("PENDING", "IN_PROGRESS", "QUEUED", "EXPECTED", "pending"):
                      pending.append(name)
                  else:
                      failed.append(f"{name}={conclusion}")
              if failed or pending or not checks:
                  detail = failed or pending or ["no exact-head checks returned"]
                  raise SystemExit(f"{milestone} PR #{number} exact-head CI is not green: {detail}")
              decision = view.get("reviewDecision") or "NONE"
              review_state = decision if decision in ("APPROVED", "CHANGES_REQUESTED", "REVIEW_REQUIRED") else "UNKNOWN" if decision != "NONE" else "NONE"
              if review_state in ("CHANGES_REQUESTED", "REVIEW_REQUIRED", "UNKNOWN"):
                  raise SystemExit(f"{milestone} PR #{number} has unresolved review state {review_state}")
              records.append({
                  "milestone": milestone, "pr": number, "branch": branch, "head_sha": head,
                  "base_branch": base_branch, "base_sha": base_sha, "merge_sha": merge_sha, "state": state,
                  "mergeability": mergeability, "review_state": review_state, "exact_head_ci": "PASS",
              })
          p019_run = json.loads(subprocess.run(
              ["gh", "api", f"repos/{repo}/actions/runs/39696560499"],
              check=True, capture_output=True, text=True).stdout)
          if (p019_run.get("head_sha") != "7d5723fca2595b8928ed3e1717ca872906d48538"
                  or p019_run.get("status") != "completed" or p019_run.get("conclusion") != "success"):
              raise SystemExit("recorded P019 successful CI run does not match its exact source head")
          Path("build/p020/milestone-chain.json").write_text(json.dumps(records, sort_keys=True, indent=2) + "\n")
          p020_pr = os.environ.get("P020_CURRENT_PR")
          integration_mode = "INTEGRATED_MAIN"
          if p020_pr:
              current = json.loads(subprocess.run(["gh", "api", f"repos/{repo}/pulls/{p020_pr}"], check=True, capture_output=True, text=True).stdout)
              if current["head"]["sha"] != os.environ["P020_SOURCE_SHA"]:
                  raise SystemExit("P020 PR head does not match the exact checked-out source SHA")
              if current["base"]["ref"] == "main":
                  integration_base = {"branch": current["base"]["ref"], "sha": current["base"]["sha"]}
              elif current["base"]["ref"] == "release/p020-v02-integration":
                  expected_base_sha = "57b06c534d18f094ad59e4229e626fae51668de9"
                  if current["head"]["ref"] != "fix/h002-p011-legacy-checksum":
                      raise SystemExit("stacked release-base validation is restricted to the H002 branch")
                  if current["base"]["sha"] != expected_base_sha:
                      raise SystemExit("H002 PR base SHA differs from the pinned P020 source head")
                  parent = json.loads(subprocess.run(
                      ["gh", "api", f"repos/{repo}/pulls/19"],
                      check=True, capture_output=True, text=True).stdout)
                  if (parent.get("state") != "open" or parent.get("merged_at")
                          or parent["head"]["ref"] != "release/p020-v02-integration"
                          or parent["head"]["sha"] != expected_base_sha
                          or parent["base"]["ref"] != "main"):
                      raise SystemExit("H002 stack does not target the open P020 PR #19 at its pinned head")
                  main = json.loads(subprocess.run(
                      ["gh", "api", f"repos/{repo}/branches/main"],
                      check=True, capture_output=True, text=True).stdout)
                  if parent["base"]["sha"] != main["commit"]["sha"]:
                      raise SystemExit("open P020 PR #19 no longer targets the current integrated main head")
                  branch = json.loads(subprocess.run(
                      ["gh", "api", f"repos/{repo}/branches/release/p020-v02-integration"],
                      check=True, capture_output=True, text=True).stdout)
                  if branch["commit"]["sha"] != expected_base_sha:
                      raise SystemExit("P020 integration branch no longer matches its pinned source head")
                  # The candidate release gate evaluates P020's eventual main
                  # integration; the H002 PR itself remains stacked on P020.
                  integration_base = {"branch": "main", "sha": parent["base"]["sha"]}
                  integration_mode = "STACKED_H002"
              elif current["base"]["ref"] == "fix/h002-p011-legacy-checksum":
                  h002_sha = "341c6840fc9d6c64876fb3a0106fd318c4dfc7c0"
                  p020_sha = "57b06c534d18f094ad59e4229e626fae51668de9"
                  h002 = json.loads(subprocess.run(
                      ["gh", "api", f"repos/{repo}/pulls/20"],
                      check=True, capture_output=True, text=True).stdout)
                  p020 = json.loads(subprocess.run(
                      ["gh", "api", f"repos/{repo}/pulls/19"],
                      check=True, capture_output=True, text=True).stdout)
                  main = json.loads(subprocess.run(
                      ["gh", "api", f"repos/{repo}/branches/main"],
                      check=True, capture_output=True, text=True).stdout)
                  h002_branch = json.loads(subprocess.run(
                      ["gh", "api", f"repos/{repo}/branches/fix/h002-p011-legacy-checksum"],
                      check=True, capture_output=True, text=True).stdout)
                  p020_branch = json.loads(subprocess.run(
                      ["gh", "api", f"repos/{repo}/branches/release/p020-v02-integration"],
                      check=True, capture_output=True, text=True).stdout)
                  h002_checks = json.loads(subprocess.run(
                      ["gh", "pr", "view", "20", "--repo", repo, "--json", "statusCheckRollup"],
                      check=True, capture_output=True, text=True).stdout).get("statusCheckRollup") or []
                  h002_failed = []
                  h002_pending = []
                  for check in h002_checks:
                      name = check.get("name") or check.get("context") or "unknown"
                      conclusion = check.get("conclusion") or check.get("state") or check.get("status")
                      if conclusion in ("SUCCESS", "success"):
                          continue
                      if conclusion in ("SKIPPED", "skipped") and name == "p008-release-attestation":
                          continue
                      if conclusion in ("PENDING", "IN_PROGRESS", "QUEUED", "EXPECTED", "pending"):
                          h002_pending.append(name)
                      else:
                          h002_failed.append(f"{name}={conclusion}")
                  if h002_failed or h002_pending or not h002_checks:
                      raise SystemExit(f"pinned H002 exact-head CI is not green: {h002_failed or h002_pending or ['no checks returned']}")

                  def is_ancestor(ancestor, commit):
                      result = subprocess.run(
                          ["git", "merge-base", "--is-ancestor", ancestor, commit],
                          check=False, capture_output=True, text=True)
                      if result.returncode not in (0, 1):
                          raise SystemExit("could not evaluate H003 stack ancestry")
                      return result.returncode == 0

                  def merge_base(left, right):
                      return subprocess.run(
                          ["git", "merge-base", left, right],
                          check=True, capture_output=True, text=True).stdout.strip()

                  try:
                      integration_base = validate_h003_stack(
                          current_pr=current,
                          h002_pr=h002,
                          p020_pr=p020,
                          h002_branch_sha=h002_branch["commit"]["sha"],
                          p020_branch_sha=p020_branch["commit"]["sha"],
                          main_sha=main["commit"]["sha"],
                          source_sha=os.environ["P020_SOURCE_SHA"],
                          is_ancestor=is_ancestor,
                          merge_base=merge_base,
                      )
                  except StackValidationError as error:
                      raise SystemExit(str(error)) from None
                  integration_mode = "STACKED_H003"
              else:
                  raise SystemExit("current PR base branch is not a supported P020 integration target")
          else:
              branch = json.loads(subprocess.run(["gh", "api", f"repos/{repo}/branches/main"], check=True, capture_output=True, text=True).stdout)
              integration_base = {"branch": "main", "sha": branch["commit"]["sha"]}
          Path("build/p020/integration-base.json").write_text(json.dumps(integration_base, sort_keys=True, indent=2) + "\n")
          if integration_mode in ("STACKED_H002", "STACKED_H003"):
              expected_base_sha = "57b06c534d18f094ad59e4229e626fae51668de9"
              subprocess.run(["git", "merge-base", "--is-ancestor", expected_base_sha, os.environ["P020_SOURCE_SHA"]], check=True)
              actual_merge_base = subprocess.run(["git", "merge-base", os.environ["P020_SOURCE_SHA"], expected_base_sha], check=True, capture_output=True, text=True).stdout.strip()
              if actual_merge_base != expected_base_sha:
                  raise SystemExit("stacked H002/H003 source/base merge-base is not the exact open P020 PR #19 head")
              print(f"Verified the P011–P019 source chain and exact-head CI, plus the {integration_mode} branch ancestry on open P020 PR #19 at its pinned head.")
          else:
              if integration_base["branch"] != "main":
                  raise SystemExit("P020 integration base branch is not main")
              subprocess.run(["git", "merge-base", "--is-ancestor", "7dbd47e4500c0ddf3d65d282d8e6a8881d6c8703", integration_base["sha"]], check=True)
              actual_merge_base = subprocess.run(["git", "merge-base", os.environ["P020_SOURCE_SHA"], integration_base["sha"]], check=True, capture_output=True, text=True).stdout.strip()
              if actual_merge_base != "7d5723fca2595b8928ed3e1717ca872906d48538":
                  raise SystemExit("P020 source/base merge-base is not the exact P019 source head")
              print("Verified the P011–P019 merged source chain and exact-head CI against the integrated main history.")
          print("P008 branch-specific attestation remains SKIPPED by its guard; it is not counted as a pass.")
          PY
      - name: Confirm the P008 guard remains a skip, not a pass
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          P020_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$P020_RUN_ID/jobs?per_page=100" > build/p020/workflow-jobs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          jobs = json.loads(Path("build/p020/workflow-jobs.json").read_text())["jobs"]
          matches = [job for job in jobs if job.get("name") == "p008-release-attestation"]
          if len(matches) != 1 or matches[0].get("conclusion") != "skipped":
              raise SystemExit("P008 branch-specific attestation was not observed as SKIPPED")
          print("P008 attestation=SKIPPED_EXPECTED_BRANCH_GUARD (not counted as PASS)")
          PY
      - name: Verify Debian prerelease ordering
        run: |
          set -euo pipefail
          dpkg --compare-versions '0.2.0~rc1-1' lt '0.2.0-1'
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Caffeinate-P020-v0.2.0-rc1-UNSIGNED-DEVICE-UNVERIFIED
          path: build/p020/candidate-inputs
      - name: Package and validate isolated candidate artifacts
        run: |
          set -euo pipefail
          source_date_epoch="$(git log -1 --format=%ct HEAD)"
          SOURCE_DATE_EPOCH="$source_date_epoch" ./scripts/package-rootful.sh --input-dir build/p020/candidate-inputs/p020-first --output-dir build/p020/package-first --package-version '0.2.0~rc1-1'
          SOURCE_DATE_EPOCH="$source_date_epoch" ./scripts/package-rootful.sh --input-dir build/p020/candidate-inputs/p020-second --output-dir build/p020/package-second --package-version '0.2.0~rc1-1'
          test "$(dpkg-deb --field build/p020/package-first/*.deb Package)" = 'com.ioscaffeinate.cli'
          test "$(dpkg-deb --field build/p020/package-first/*.deb Version)" = '0.2.0~rc1-1'
          test "$(dpkg-deb --field build/p020/package-first/*.deb Architecture)" = 'iphoneos-arm'
          python3 scripts/validate_rootful_package.py build/p020/package-first/*.deb --expected-version '0.2.0~rc1-1' --report build/p020/package-first/validation.txt
          python3 scripts/validate_rootful_package.py build/p020/package-second/*.deb --expected-version '0.2.0~rc1-1' --report build/p020/package-second/validation.txt
          (cd build/p020/package-first && sha256sum -c *.deb.sha256)
          (cd build/p020/package-second && sha256sum -c *.deb.sha256)
          grep -q 'signing_state=UNSIGNED' build/p020/package-first/validation.txt
          grep -q 'device_package_acceptance=NOT_ACCEPTED' build/p020/package-first/validation.txt
          python3 scripts/p020_scan_candidate.py build/p020/package-first/*.deb
          python3 scripts/p020_scan_candidate.py build/p020/package-second/*.deb
      - name: Record and validate exact build provenance
        env:
          P020_BRANCH: ${{ github.head_ref || github.ref_name }}
          P020_RUN_ID: ${{ github.run_id }}
          P020_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          P020_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 scripts/p020_build_provenance.py capture \
            --first-build-info build/p020/candidate-inputs/p020-first/build-info.json \
            --first-binary-dir build/p020/candidate-inputs/p020-first \
            --first-package build/p020/package-first/ioscaffeinate_0.2.0~rc1-1_iphoneos-arm_UNSIGNED-DEVICE-UNVERIFIED.deb \
            --second-build-info build/p020/candidate-inputs/p020-second/build-info.json \
            --second-binary-dir build/p020/candidate-inputs/p020-second \
            --second-package build/p020/package-second/ioscaffeinate_0.2.0~rc1-1_iphoneos-arm_UNSIGNED-DEVICE-UNVERIFIED.deb \
            --branch "$P020_BRANCH" --run-id "$P020_RUN_ID" --run-url "$P020_RUN_URL" --event "$P020_EVENT" \
            --output build/p020/P020-BUILD-PROVENANCE.json > build/p020/build-provenance-capture.json
          python3 scripts/p020_build_provenance.py validate --manifest build/p020/P020-BUILD-PROVENANCE.json > build/p020/build-provenance-validation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("build/p020")
          provenance = json.loads((root / "P020-BUILD-PROVENANCE.json").read_text())
          if provenance["signing"]["state"] != "UNSIGNED" or provenance["signing"]["provenance_status"] != "SIGNER_PROVENANCE_BLOCKED":
              raise SystemExit("candidate signing provenance was overstated")
          if provenance["validation"]["device_installation"] != "NOT_PERFORMED":
              raise SystemExit("cloud candidate was labeled as installed")
          print("Build provenance validated; reproducibility=" + provenance["reproducibility"]["status"])
          PY
      - name: Validate release evaluator, build provenance, PR chain, and security negative paths
        env:
          GH_TOKEN: ${{ github.token }}
          P020_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          P020_CURRENT_PR: ${{ github.event.pull_request.number || '' }}
          P020_RUN_ID: ${{ github.run_id }}
          P020_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          P020_EVENT: ${{ github.event_name }}
          P020_BRANCH: ${{ github.head_ref || github.ref_name }}
          P020_WORKFLOW_RUN: ${{ needs.linux-protocol.result }}
          P020_LINUX: ${{ needs.linux-protocol.result }}
          P020_IOS_CROSS: ${{ needs.ios-cross-build.result }}
          P020_IOS_INSPECTION: ${{ needs.ios-artifact-inspection.result }}
          P020_PACKAGE: ${{ needs.ios-rootful-package.result }}
          P020_P009: ${{ needs.p009-evidence-validation.result }}
          P020_P011: ${{ needs.p011-release-preflight.result }}
          P020_P010: ${{ needs.p010-signing-release-gate.result }}
          P020_P012: ${{ needs.p012-idle-research-validation.result }}
          P020_P013: ${{ needs.p013-launchd-lifecycle-validation.result }}
          P020_P014: ${{ needs.p014-crash-recovery-validation.result }}
          P020_P015: ${{ needs.p015-server-policy-validation.result }}
          P020_P016: ${{ needs.p016-health-telemetry-validation.result }}
          P020_P017: ${{ needs.p017-scheduling-validation.result }}
          P020_P018: ${{ needs.p018-cli-package-ux-validation.result }}
          P020_P019: ${{ needs.p019-supervised-reliability-validation.result }}
          P020_CANDIDATE_CROSS: ${{ needs.p020-candidate-cross-build.result }}
        run: |
          set -euo pipefail
          mkdir -p build/p020
          python3 -m py_compile scripts/p020_release_gate.py scripts/p020_build_provenance.py scripts/p020_scan_candidate.py
          ./scripts/build-linux-test.sh
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh
          python3 -m unittest tests.test_p020_release_gate tests.test_p020_build_provenance tests.test_p020_candidate_scan tests.test_p020_end_to_end -v 2>&1 | tee build/p020/p020-tests.txt
          python3 -m unittest discover -s tests -v 2>&1 | tee build/p020/python-regressions.txt
          python3 -m unittest discover -s tests/packaging -v 2>&1 | tee build/p020/packaging-regressions.txt
          python3 tests/integration.py 2>&1 | tee build/p020/protocol-integration.txt
          python3 scripts/check_p018_docs_shell.py | tee build/p020/shell-syntax.txt
          sh -n packaging/rootful/manager
          sh -n packaging/rootful/DEBIAN/preinst
          sh -n packaging/rootful/DEBIAN/prerm
          bash -n scripts/build-macos.sh
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          root = Path("build/p020")
          source = os.environ["P020_SOURCE_SHA"]
          if Path("build/p020/source-commit.txt").read_text().strip() != source:
              raise SystemExit("P020 checked-out source identity changed")
          workflows = [Path(".github/workflows/publish-rc1.yml").read_text(), Path(".github/workflows/publish-stable.yml").read_text()]
          if any("v0.2.0" in workflow or "0.2.0-1" in workflow for workflow in workflows):
              raise SystemExit("existing publication workflow has an unapproved v0.2 trigger or artifact")
          ci_workflow = Path(".github/workflows/ci.yml").read_text()
          p020_job = ci_workflow.split("  p020-release-readiness-validation:", 1)[1]
          if re.search(r"gh\s+release\s+create|git\s+tag|launchctl\s+(?:load|bootstrap|enable|kickstart|start|restart)|\bldid\b", p020_job, re.I):
              raise SystemExit("P020 CI contains a publication, launchd, or signing action")
          if "SIGKILL" in "\n".join(path.read_text(errors="ignore") for path in Path("src").glob("*.c")):
              raise SystemExit("SIGKILL fallback appears in privileged runtime source")
          for name, result in {
              "linux-protocol": os.environ["P020_LINUX"], "ios-cross-build": os.environ["P020_IOS_CROSS"],
              "ios-artifact-inspection": os.environ["P020_IOS_INSPECTION"], "ios-rootful-package": os.environ["P020_PACKAGE"],
              "p009-evidence-validation": os.environ["P020_P009"], "p011-release-preflight": os.environ["P020_P011"],
              "p010-signing-release-gate": os.environ["P020_P010"], "p012-idle-research-validation": os.environ["P020_P012"],
              "p013-launchd-lifecycle-validation": os.environ["P020_P013"], "p014-crash-recovery-validation": os.environ["P020_P014"],
              "p015-server-policy-validation": os.environ["P020_P015"], "p016-health-telemetry-validation": os.environ["P020_P016"],
              "p017-scheduling-validation": os.environ["P020_P017"], "p018-cli-package-ux-validation": os.environ["P020_P018"],
              "p019-supervised-reliability-validation": os.environ["P020_P019"], "p020-candidate-cross-build": os.environ["P020_CANDIDATE_CROSS"],
          }.items():
              if result != "success":
                  raise SystemExit(f"required exact-source dependency {name} is {result}")
          p019_sim = json.loads((Path("build/p019/simulation") / "analysis.json").read_text())
          if p019_sim["status"] == "ACCEPTED_FOR_TESTED_SCOPE" or p019_sim["hardware_acceptance"] != "NOT_ESTABLISHED":
              raise SystemExit("simulated P019 data incorrectly claims hardware acceptance")
          print("Required exact-source cloud dependencies and publication/device-side-effect guards verified.")
          PY
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("build/p020")
          chain = json.loads((root / "milestone-chain.json").read_text())
          workflow_jobs = json.loads((root / "workflow-jobs.json").read_text())["jobs"]
          p008_jobs = [job for job in workflow_jobs if job.get("name") == "p008-release-attestation"]
          if len(p008_jobs) != 1 or p008_jobs[0].get("conclusion") != "skipped":
              raise SystemExit("P008 is not the expected branch-guard skip")
          source = (root / "source-commit.txt").read_text().strip()
          gate_names = ["source_integration", "native_build", "ios_cross_build", "macho_inspection", "rootful_packaging", "signing_metadata", "security_analysis", "regression_ci", "evidence_schema_compatibility", "build_provenance"]
          results = {name: "PASS" for name in gate_names}
          attestation = {
              "schema_version": 1, "source_sha": source,
              "tree_sha": (root / "source-tree.txt").read_text().strip(),
              "gate_results": results,
              "dependency_jobs": {
                  "linux-protocol": os.environ["P020_LINUX"], "ios-cross-build": os.environ["P020_IOS_CROSS"],
                  "ios-artifact-inspection": os.environ["P020_IOS_INSPECTION"], "ios-rootful-package": os.environ["P020_PACKAGE"],
                  "p009-evidence-validation": os.environ["P020_P009"], "p011-release-preflight": os.environ["P020_P011"],
                  "p010-signing-release-gate": os.environ["P020_P010"], "p012-idle-research-validation": os.environ["P020_P012"],
                  "p013-launchd-lifecycle-validation": os.environ["P020_P013"], "p014-crash-recovery-validation": os.environ["P020_P014"],
                  "p015-server-policy-validation": os.environ["P020_P015"], "p016-health-telemetry-validation": os.environ["P020_P016"],
                  "p017-scheduling-validation": os.environ["P020_P017"], "p018-cli-package-ux-validation": os.environ["P020_P018"],
                  "p019-supervised-reliability-validation": os.environ["P020_P019"], "p020-candidate-cross-build": os.environ["P020_CANDIDATE_CROSS"],
              },
              "p008_release_attestation": "SKIPPED_EXPECTED_BRANCH_GUARD",
              "publication_steps": "NONE", "device_execution": "NOT_PERFORMED",
          }
          attestation_path = root / "ci-attestation.json"
          attestation_path.write_text(json.dumps(attestation, sort_keys=True, indent=2) + "\n")
          digest = hashlib.sha256(attestation_path.read_bytes()).hexdigest()
          cloud = {name: {"status": "PASS", "evidence": [{"path": "ci-attestation.json", "sha256": digest, "evidence_class": "CI"}]} for name in gate_names}
          provenance_path = root / "P020-BUILD-PROVENANCE.json"
          cloud["build_provenance"] = {"status": "PASS", "evidence": [{
              "path": provenance_path.name,
              "sha256": hashlib.sha256(provenance_path.read_bytes()).hexdigest(),
              "evidence_class": "BUILD_PROVENANCE",
          }]}
          hw_names = ["p010_signer_provenance", "p011_stable_package_acceptance", "installed_candidate_identity", "p012_physical_trials", "p013_lifecycle_acceptance", "p014_physical_recovery", "p016_resource_review", "p018_privacy_review", "p019_supervised_cycles", "p009_independent_provenance_review"]
          manifest = {
              "schema_version": 1,
              "release": {"version": "v0.2.0", "package_identifier": "com.ioscaffeinate.cli", "package_version": "0.2.0~rc1-1", "architecture": "iphoneos-arm"},
              "source": {
                  "repository": "nghianguyen150612/iOS-Caffeinate", "branch": "release/p020-v02-integration",
                  "commit_sha": source, "tree_sha": attestation["tree_sha"],
                  "p020_base_branch": json.loads((root / "integration-base.json").read_text())["branch"],
                  "p020_base_sha": json.loads((root / "integration-base.json").read_text())["sha"],
                  "current_pr": int(__import__("os").environ["P020_CURRENT_PR"]) if __import__("os").environ.get("P020_CURRENT_PR") else None,
                  "milestone_chain": chain,
              },
              "cloud_gates": cloud,
              "hardware_gates": {name: {"evidence": []} for name in hw_names},
              "scope": {"out_of_scope_features": ["automatic_restart", "unattended_schedule_execution", "scheduled_deep_sleep_wake"]},
              "authorization": {"release_critical_issues_resolved": None, "operator_acceptance_review": None,
                  "limitations_disclosed": None, "rollback_plan_review": None, "human_release_approval": None,
                  "publication_authorization": None},
              "reproducibility": json.loads((root / "P020-BUILD-PROVENANCE.json").read_text())["reproducibility"]["status"],
          }
          (root / "release-manifest.json").write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n")
          PY
          python3 scripts/p020_release_gate.py assess --manifest "$GITHUB_WORKSPACE/build/p020/release-manifest.json" --expected-source-sha "$P020_SOURCE_SHA" > build/p020/release-assessment.json
          python3 scripts/p020_release_gate.py report --manifest "$GITHUB_WORKSPACE/build/p020/release-manifest.json" --expected-source-sha "$P020_SOURCE_SHA" > build/p020/release-assessment.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("build/p020/release-assessment.json").read_text())
          if result["decision"] != "RELEASE_BLOCKED":
              raise SystemExit(f"expected physical evidence gates to block release, got {result['decision']}")
          if result["publication_authorized"] is not False:
              raise SystemExit("P020 release assessment incorrectly authorized publication")
          expected = {"p010_signer_provenance", "p011_stable_package_acceptance", "installed_candidate_identity", "p012_physical_trials", "p013_lifecycle_acceptance", "p014_physical_recovery", "p016_resource_review", "p018_privacy_review", "p019_supervised_cycles", "p009_independent_provenance_review"}
          if expected - set(result["hardware_gates"]):
              raise SystemExit("release assessment omitted a required hardware gate")
          if any(result["hardware_gates"][name]["status"] != "PENDING" for name in expected):
              raise SystemExit("cloud fixtures or CI status incorrectly satisfied physical acceptance")
          if not any("SIGNER_PROVENANCE_BLOCKED" in blocker for blocker in result["blockers"]):
              raise SystemExit("missing pinned signer provenance did not block readiness")
          print("P020 decision=RELEASE_BLOCKED; expected hardware blockers validated; CI assessment test passes.")
          PY
