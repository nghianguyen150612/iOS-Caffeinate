            -o build/p015/daemon-readonly
          build/p015/daemon-readonly 2>&1 | tee build/p015/daemon-readonly-tests.txt
      - name: Verify policy module has no runtime or power-control calls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("src/server_policy.c").read_text(encoding="utf-8")
          forbidden = ("launchctl", "IOKit", "system(", "fork(", "execv(", "posix_spawn(", "socket(", "open(", "unlink(", "rename(")
