name: iOS-Caffeinate CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build explicit C11 mock and run integration tests
        run: |
          ./scripts/build-linux-test.sh
          python3 tests/integration.py 2>&1 | tee build/test/integration-report.txt
      - name: Verify Linux backend cannot build without mock gate
        run: |
          if cc -std=c11 -c src/power.c -o build/test/ungated.o 2>build/test/ungated.log; then
            echo 'ERROR: Linux backend built without explicit mock gate'
            exit 1
          fi
          cat build/test/ungated.log
          grep -q 'No real backend for this OS' build/test/ungated.log
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-linux-regression-evidence
          if-no-files-found: error
          path: build/test/integration-report.txt
  ios-cross-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Cross-compile with official iPhoneOS SDK for iOS 12 ARM64
        run: |
          ./scripts/build-macos.sh
          test -L dist/ic
          test "$(readlink dist/ic)" = ios-caffeinate
          (cd dist && shasum -a 256 -c SHA256SUMS)
          plutil -lint packaging/com.ioscaffeinate.daemon.plist
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-ios12-arm64-UNSIGNED-HARDWARE-UNVERIFIED
          if-no-files-found: error
          path: |
            dist/ios-caffeinate
            dist/ios-caffeinated
            dist/SHA256SUMS
            dist/build-info.json
  ios-artifact-inspection:
    needs: ios-cross-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Caffeinate-ios12-arm64-UNSIGNED-HARDWARE-UNVERIFIED
          path: dist
      - name: Verify Mach-O device platform, ARM64, iOS 12.0, dependencies and unsigned state
        run: |
          set -o pipefail
          (cd dist && shasum -a 256 -c SHA256SUMS)
          python3 scripts/inspect-ios.py | tee dist/inspection.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-ios12-arm64-inspection-evidence
          if-no-files-found: error
          path: dist/inspection.txt
  ios-rootful-package:
    needs: [linux-protocol, ios-cross-build, ios-artifact-inspection]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Caffeinate-ios12-arm64-UNSIGNED-HARDWARE-UNVERIFIED
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Caffeinate-ios12-arm64-inspection-evidence
          path: evidence
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Caffeinate-linux-regression-evidence
          path: dist/linux-evidence
      - name: Verify upstream Mach-O inspection evidence and artifact hashes
        run: |
          test -s evidence/inspection.txt
          grep -q 'PASS: both unsigned iOS 12.0 ARM64 device executables inspected' evidence/inspection.txt
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Prepare package evidence directory
        run: mkdir -p dist/package
      - name: Run deterministic package regression tests
        run: python3 -m unittest discover -s tests/packaging -v 2>&1 | tee dist/package/packaging-tests.txt
      - name: Build unsigned rootful Debian package
        run: ./scripts/package-rootful.sh --input-dir dist --output-dir dist/package
      - name: Inspect package, scripts, paths, checksums, and extracted payload
        run: |
          set -o pipefail
          package=$(find dist/package -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          python3 scripts/validate_rootful_package.py "$package" --report dist/package/validation.txt
          (cd "$(dirname "$package")" && sha256sum -c "$(basename "$package").sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-rootful-iphoneos-arm-UNSIGNED-DEVICE-UNVERIFIED
          if-no-files-found: error
          path: |
            dist/package/*.deb
            dist/package/*.sha256
            dist/package/*.files.sha256
            dist/package/*.manifest.txt
            dist/package/*.manifest.json
            dist/package/validation.txt
            dist/package/packaging-tests.txt

  p009-evidence-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run P009 schema, fixture, replay, safety, and file-security tests
        run: |
          set -o pipefail
          mkdir -p build/p009
          python3 -m unittest discover -s tests -p 'test_p009_evidence.py' -v 2>&1 | tee build/p009/p009-tests.txt
      - name: Validate fixture and produce deterministic offline reports
        run: |
          set -euo pipefail
          mkdir -p build/p009
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tests")
          from p009_fixtures import build_fixture
          build_fixture(Path("build/p009/simulated-session"), "valid_simulated_bounded_trial")
          PY
          python3 scripts/p009_evidence.py validate build/p009/simulated-session --json > build/p009/validation.json
          python3 scripts/p009_evidence.py replay build/p009/simulated-session --json > build/p009/replay.json
          python3 scripts/p009_evidence.py report build/p009/simulated-session --format json > build/p009/readiness.json
          python3 scripts/p009_evidence.py report build/p009/simulated-session > build/p009/readiness.md
          python3 scripts/p009_evidence.py report build/p009/simulated-session --format json > build/p009/readiness-repeat.json
          cmp build/p009/readiness.json build/p009/readiness-repeat.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("build/p009/readiness.json").read_text())
          assert report["decision"]["hardware_acceptance"] == "PENDING"
          assert report["decision"]["unattended_24_7"] == "NOT_VALIDATED"
          assert report["decision"]["scheduled_wake"] == "UNVERIFIED"
          assert report["decision"]["unattended_operation_authorized"] is False
          PY
          git rev-parse HEAD > build/p009/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-P009-offline-evidence
          if-no-files-found: error
          path: |
            build/p009/p009-tests.txt
            build/p009/validation.json
            build/p009/replay.json
            build/p009/readiness.json
            build/p009/readiness.md
            build/p009/source-commit.txt

  p011-release-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Run offline P011 release and device-preflight regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/p011
          sh -n scripts/p011_device_preflight.sh
          python3 -m py_compile scripts/p011_release_preflight.py
          python3 scripts/p011_release_preflight.py --help > build/p011/release-preflight-help.txt
          python3 -m unittest discover -s tests -p 'test_p011_preflight.py' -v 2>&1 | tee build/p011/p011-tests.txt
          git rev-parse HEAD > build/p011/source-commit.txt
          python3 - <<'PY'
          import re
          from pathlib import Path

          output = Path("build/p011/p011-tests.txt").read_text()
          match = re.search(r"Ran (\d+) tests? in ", output)
          if not match or "\nOK\n" not in output:
              raise SystemExit("P011 offline regression suite did not finish successfully")
          source = Path("build/p011/source-commit.txt").read_text().strip()
          Path("build/p011/P011-VALIDATION.txt").write_text(
              "\n".join([
                  "P011 offline regression suite: PASS",
                  f"tests: {match.group(1)}",
                  f"source_sha: {source}",
                  "device_preflight_shell_syntax: PASS",
                  "device_execution: NOT_PERFORMED",
              ]) + "\n"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-P011-cloud-validation
          if-no-files-found: error
          path: |
            build/p011/P011-VALIDATION.txt
            build/p011/p011-tests.txt
            build/p011/source-commit.txt
            build/p011/release-preflight-help.txt

  p010-signing-release-gate:
    needs: [linux-protocol, ios-cross-build, ios-artifact-inspection, ios-rootful-package, p009-evidence-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Caffeinate-ios12-arm64-UNSIGNED-HARDWARE-UNVERIFIED
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Caffeinate-rootful-iphoneos-arm-UNSIGNED-DEVICE-UNVERIFIED
          path: dist/package
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Caffeinate-linux-regression-evidence
          path: build/p010/linux-evidence
      - name: Validate P010 profile and Debian prerelease ordering
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from signing_profile import load_approved_profile
          profile = Path("packaging/signing/profiles/amethyst-ios12-rootful.plist")
          entitlements, digest = load_approved_profile(profile)
          assert entitlements == {"com.apple.private.security.no-container": True}
          print("profile_id=amethyst-ios12-rootful")
          print(f"profile_sha256={digest}")
          print("profile_entitlements=EXACT_MATCH")
          PY
          dpkg --compare-versions 0.1.0~rc1-1 lt 0.1.0-1
          mkdir -p build/p010
          git rev-parse HEAD | tee build/p010/source-commit.txt
      - name: Run deterministic P010 signing and release-gate regressions
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests/packaging -p 'test_p010_signing.py' -v 2>&1 | tee build/p010/p010-tests.txt
      - name: Run P007 package payload and state-preservation regressions
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests/packaging -p 'test_rootful_package.py' -v 2>&1 | tee build/p010/packaging-tests.txt
      - name: Run P009 evidence regressions
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p 'test_p009_evidence.py' -v 2>&1 | tee build/p010/p009-tests.txt
      - name: Inspect the exact unsigned CI package and prepare operator evidence bundle
        run: |
          set -euo pipefail
          package=$(find dist/package -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          python3 scripts/validate_rootful_package.py "$package" --report build/p010/unsigned-package-validation.txt
          (cd "$(dirname "$package")" && sha256sum -c "$(basename "$package").sha256")
          python3 scripts/p010_evidence.py prepare --output-dir build/p010/operator-reported-evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          bundle = json.loads(Path("build/p010/operator-reported-evidence/bundle-metadata.json").read_text())
          assert bundle["evidence_origin"] == "OPERATOR_RECORDED"
          assert bundle["review_status"] == "REVIEW_REQUIRED"
          assert bundle["raw_evidence_files"] == []
          assert bundle["release_authorization"] == "BLOCKED"
          PY
      - name: Generate exact-source P010 RC manifest and validation summary
        env:
          P010_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          P010_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          P010_LINUX_PROTOCOL_RESULT: ${{ needs.linux-protocol.result }}
          P010_IOS_CROSS_BUILD_RESULT: ${{ needs.ios-cross-build.result }}
          P010_IOS_INSPECTION_RESULT: ${{ needs.ios-artifact-inspection.result }}
          P010_ROOTFUL_PACKAGE_RESULT: ${{ needs.ios-rootful-package.result }}
          P010_P009_RESULT: ${{ needs.p009-evidence-validation.result }}
        run: |
          set -euo pipefail
          python3 scripts/p010_release_manifest.py --dist dist --output dist/package/P010-RELEASE-MANIFEST.json
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          def count(path):
              match = re.search(r"Ran (\d+) tests? in ", Path(path).read_text())
              if not match:
                  raise SystemExit(f"missing unittest count in {path}")
              return int(match.group(1))
          p010 = count("build/p010/p010-tests.txt")
          packaging = count("build/p010/packaging-tests.txt")
          p009 = count("build/p010/p009-tests.txt")
          linux = count("build/p010/linux-evidence/integration-report.txt")
          source = os.environ["P010_SOURCE_SHA"]
          lines = [
              "# P010 Exact-Source Validation Summary", "",
              f"Source SHA: `{source}`", "",
              "| Suite | Tests | Result |", "|---|---:|---|",
              f"| Linux integration | {linux} | PASS |",
              f"| P010 signing/release | {p010} | PASS |",
              f"| Rootful packaging | {packaging} | PASS |",
              f"| P009 evidence | {p009} | PASS |", "",
              f"Linux integration: PASS at source SHA `{source}` (see linux-protocol artifact).",
              f"iOS cross-build, artifact inspection, and unsigned package jobs: PASS at `{source}`.",
              "P008 branch-specific attestation: SKIPPED by its release/p008-v01-integration guard.",
              "P010 result: PASS; hosted artifact remains unsigned; device package acceptance and release authorization remain BLOCKED.", "",
          ]
          Path("build/p010/P010-VALIDATION.md").write_text("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-P010-exact-source-evidence
          if-no-files-found: error
          path: |
            build/p010/source-commit.txt
            build/p010/p010-tests.txt
            build/p010/packaging-tests.txt
            build/p010/p009-tests.txt
            build/p010/linux-evidence/integration-report.txt
            build/p010/unsigned-package-validation.txt
            build/p010/P010-VALIDATION.md
            build/p010/operator-reported-evidence/**
            dist/package/P010-RELEASE-MANIFEST.json

  p008-release-attestation:
    if: github.ref == 'refs/heads/release/p008-v01-integration' || (github.event_name == 'pull_request' && github.head_ref == 'release/p008-v01-integration')
    needs: [linux-protocol, ios-cross-build, ios-artifact-inspection, ios-rootful-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Caffeinate-ios12-arm64-UNSIGNED-HARDWARE-UNVERIFIED
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Caffeinate-ios12-arm64-inspection-evidence
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Caffeinate-linux-regression-evidence
          path: dist/linux-evidence
      - uses: actions/download-artifact@v4
        with:
          name: iOS-Caffeinate-rootful-iphoneos-arm-UNSIGNED-DEVICE-UNVERIFIED
          path: dist/package
      - name: Generate exact-source release candidate manifest and readiness attestation
        env:
          P008_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NEEDS_LINUX_PROTOCOL_RESULT: ${{ needs.linux-protocol.result }}
          NEEDS_IOS_CROSS_BUILD_RESULT: ${{ needs.ios-cross-build.result }}
          NEEDS_IOS_ARTIFACT_INSPECTION_RESULT: ${{ needs.ios-artifact-inspection.result }}
          NEEDS_IOS_ROOTFUL_PACKAGE_RESULT: ${{ needs.ios-rootful-package.result }}
        run: python3 scripts/generate_p008_attestation.py
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-P008-v0.1-cloud-attestation
          if-no-files-found: error
          path: |
            dist/package/release-candidate.json
            dist/package/P008-CI-ATTESTATION.md
            dist/package/P008-RELEASE-READINESS.md

  p012-idle-research-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify P012 protocol and trial-format JSON
        run: |
          set -euo pipefail
          mkdir -p build/p012
          python3 -m json.tool experiments/p012/protocol-v1.json > /dev/null
          python3 -m json.tool experiments/p012/protocol-v1.schema.json > /dev/null
          python3 -m json.tool experiments/p012/trial-record-v1.schema.json > /dev/null
          python3 scripts/p012_trial.py validate > build/p012/protocol-validation.json
      - name: Compile P012 standard-library tools
        run: |
          python3 -m py_compile \
            scripts/p012_common.py \
            scripts/p012_host_probe.py \
            scripts/p012_trial.py \
            scripts/p012_analyze.py \
            tests/p012_fixtures.py \
            tests/test_p012_research.py
      - name: Run P012 offline protocol, measurement, safety, privacy, analysis, and P009 mapping tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_p012_research.py' -v 2>&1 | tee build/p012/p012-tests.txt
      - name: Rerun existing P009 validator regression for compatibility
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_p009_evidence.py' -v 2>&1 | tee build/p012/p009-compatibility-tests.txt
      - name: Produce deterministic SIMULATED analysis and source record
        run: |
          set -euo pipefail
          python3 tests/p012_fixtures.py build/p012/simulated-all-success.json --scenario all-success
          source_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$source_sha" > build/p012/source-commit.txt
          python3 scripts/p012_analyze.py build/p012/simulated-all-success.json \
            --source-sha "$source_sha" --format json --output build/p012/analysis-report.json
          python3 scripts/p012_analyze.py build/p012/simulated-all-success.json \
            --source-sha "$source_sha" --format markdown --output build/p012/analysis-report.md
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("build/p012/analysis-report.json").read_text())
          assert report["counts"]["records"] == 24
          assert report["evidence_origins"] == ["SIMULATED"]
          assert report["evidence_strength"]["strong_evidence_established"] is False
          assert all(group["success_percent"] == 100.0 for group in report["groups"])
          assert all(item["outcome"] == "NO_OBSERVABLE_DIFFERENCE" for item in report["comparisons"])
          assert all(item["outcome"] == "NO_OBSERVABLE_DIFFERENCE" for item in report["route_comparisons"])
          assert report["source_commit_sha"] == Path("build/p012/source-commit.txt").read_text().strip()
          PY
          python3 - <<'PY'
          import re
          from pathlib import Path

          test_log = Path("build/p012/p012-tests.txt").read_text()
          match = re.search(r"Ran (\d+) tests? in ", test_log)
          if not match or "\nOK\n" not in test_log:
              raise SystemExit("P012 offline regression suite did not finish successfully")
          sha = Path("build/p012/source-commit.txt").read_text().strip()
          Path("build/p012/P012-VALIDATION.txt").write_text("\n".join([
              "P012 protocol validation: PASS",
              f"P012 offline tests: {match.group(1)} PASS",
              "P009 v1 compatibility tests: PASS",
              "analysis fixture origin: SIMULATED",
              "physical device access: NOT_PERFORMED",
              "SSH probes: MOCKED_OR_DRY_RUN_ONLY",
              "power assertions: NOT_CREATED",
              f"checked_out_source_sha: {sha}",
          ]) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-P012-idle-research-validation
          if-no-files-found: error
          path: |
            build/p012/P012-VALIDATION.txt
            build/p012/protocol-validation.json
            build/p012/p012-tests.txt
            build/p012/p009-compatibility-tests.txt
            build/p012/source-commit.txt
            build/p012/simulated-all-success.json
            build/p012/analysis-report.json
            build/p012/analysis-report.md

  p013-launchd-lifecycle-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile C11 CLI and injected lifecycle test runner
        run: |
          set -euo pipefail
          mkdir -p build/p013 build/test
          ./scripts/build-linux-test.sh
          cc -std=c11 -Wall -Wextra -Werror -O2 -DIOSCAFFEINATE_SERVICE_TESTING \
            tests/p013_service_unit.c src/service.c src/recovery.c -o build/p013/service-unit
          build/p013/service-unit 2>&1 | tee build/p013/native-tests.txt
          cc -std=c11 -Wall -Wextra -Werror -O2 -DIOSCAFFEINATE_TEST_MOCK \
            tests/daemon_readonly_test.c src/power.c src/schedule.c src/recovery.c -o build/p013/daemon-readonly
          build/p013/daemon-readonly 2>&1 | tee build/p013/daemon-readonly-tests.txt
          build/p013/service-unit --emit-managed build/p013/managed-live.plist
      - name: Validate disabled package template and managed KeepAlive false profile
        env:
          P013_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P013_SOURCE_SHA"
          printf '%s\n' "$P013_SOURCE_SHA" > build/p013/source-commit.txt
          python3 scripts/p013_validate.py \
            --managed build/p013/managed-live.plist \
            --source-sha "$P013_SOURCE_SHA" \
            --output build/p013/P013-VALIDATION.txt
          sh -n packaging/rootful/DEBIAN/preinst
          sh -n packaging/rootful/DEBIAN/prerm
      - name: Run P013 command, fail-closed, and package-removal tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_p013_service.py' -v 2>&1 | tee build/p013/command-tests.txt
          python3 -m unittest discover -s tests/packaging -p 'test_rootful_package.py' -v 2>&1 | tee build/p013/package-tests.txt
      - name: Record deterministic evidence summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          records = []
          for label, path in (("P013 command tests", "build/p013/command-tests.txt"),
                              ("rootful package tests", "build/p013/package-tests.txt")):
              text = Path(path).read_text()
              match = re.search(r"Ran (\d+) tests? in ", text)
              if not match or "\nOK\n" not in text:
                  raise SystemExit(f"{label} did not pass")
              records.append(f"{label}: {match.group(1)} PASS")
          records.insert(0, "P013 native C lifecycle checks: PASS (see native-tests.txt)")
          records.insert(1, "P013 daemon read-only status checks: PASS (see daemon-readonly-tests.txt)")
          records.extend((
              "package installation activation: NOT_PERFORMED",
              "launchctl mutation: NOT_PERFORMED",
              "power assertions: NOT_ACQUIRED",
              "device lifecycle compatibility: UNVERIFIED",
              "source_sha: " + Path("build/p013/source-commit.txt").read_text().strip(),
          ))
          Path("build/p013/P013-CLOUD-VALIDATION.txt").write_text("\n".join(records) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-P013-launchd-lifecycle-validation
          if-no-files-found: error
          path: |
            build/p013/P013-VALIDATION.txt
            build/p013/P013-CLOUD-VALIDATION.txt
            build/p013/native-tests.txt
            build/p013/daemon-readonly-tests.txt
            build/p013/command-tests.txt
            build/p013/package-tests.txt
