          python3 -m unittest discover -s tests -p 'test_p009_evidence.py' -v 2>&1 | tee build/p017/p009-tests.txt
          python3 -m unittest discover -s tests -p 'test_p011_preflight.py' -v 2>&1 | tee build/p017/p011-tests.txt
          python3 -m unittest discover -s tests -p 'test_p012_research.py' -v 2>&1 | tee build/p017/p012-tests.txt
          python3 -m unittest discover -s tests -p 'test_p013_service.py' -v 2>&1 | tee build/p017/p013-tests.txt
          python3 -m unittest discover -s tests/packaging -p 'test_p010_signing.py' -v 2>&1 | tee build/p017/p010-tests.txt
          python3 -m unittest discover -s tests/packaging -p 'test_rootful_package.py' -v 2>&1 | tee build/p017/package-tests.txt
      - name: Verify scheduler has no process-global timezone or execution side effects
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          schedule = Path("src/schedule.c").read_text(encoding="utf-8")
          daemon = Path("src/daemon.c").read_text(encoding="utf-8")
          cli = Path("src/cli.c").read_text(encoding="utf-8")
          forbidden_schedule = ("setenv(", "unsetenv(", "tzset(", "mktime(",
                                "IOKit", "launchctl", "socket(", "connect(",
                                "fork(", "execv(", "system(")
          found = [item for item in forbidden_schedule if item in schedule]
          if found:
              raise SystemExit("schedule recurrence contains forbidden side effects: " + ",".join(found))
          if "schedule_store_evaluate(" in daemon or "check_and_trigger_schedules" in daemon:
              raise SystemExit("daemon still has an automatic schedule execution path")
          # Anchor the implementation, not its forward declaration. Other CLI
          # helpers may execute bounded read-only diagnostics before this block.
          diagnostics = cli.split(
              "static int schedule_diagnostics_command(int argc, char **argv, const char *socket_path,", 1
          )[1].split(
              "static int schedule_cli_load_store", 1
          )[0]
          forbidden_cli = ("system(", "popen(", "execv(", "launchctl", "START ", "PROBE\\n")
          found = [item for item in forbidden_cli if item in diagnostics]
          if found:
              raise SystemExit("read-only schedule diagnostics contain an activation path: " + ",".join(found))
          print("schedule timezone and side-effect boundary: PASS")
          PY
      - name: Write deterministic exact-source validation evidence
        env:
          P017_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          P009_RESULT: ${{ needs.p009-evidence-validation.result }}
          P010_RESULT: ${{ needs.p010-signing-release-gate.result }}
          P011_RESULT: ${{ needs.p011-release-preflight.result }}
          P012_RESULT: ${{ needs.p012-idle-research-validation.result }}
          P013_RESULT: ${{ needs.p013-launchd-lifecycle-validation.result }}
          P014_RESULT: ${{ needs.p014-crash-recovery-validation.result }}
          P015_RESULT: ${{ needs.p015-server-policy-validation.result }}
          P016_RESULT: ${{ needs.p016-health-telemetry-validation.result }}
          IOS_BUILD_RESULT: ${{ needs.ios-cross-build.result }}
          MACHO_RESULT: ${{ needs.ios-artifact-inspection.result }}
          PACKAGE_RESULT: ${{ needs.ios-rootful-package.result }}
          LINUX_RESULT: ${{ needs.linux-protocol.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path("build/p017")
          source_sha = os.environ["P017_SOURCE_SHA"]
          if (root / "source-commit.txt").read_text().strip() != source_sha:
              raise SystemExit("P017 report SHA differs from checked-out source")

          def native(filename, pattern, label):
              match = re.search(pattern, (root / filename).read_text())
              if not match:
                  raise SystemExit(f"{label} native suite did not report success")
              return {"checks": int(match.group(1)), "result": "PASS"}

          def python_suite(filename, label):
              content = (root / filename).read_text()
              match = re.search(r"Ran (\d+) tests? in ", content)
              if not match or "\nOK\n" not in content:
                  raise SystemExit(f"{label} suite did not pass")
              return {"tests": int(match.group(1)), "result": "PASS"}

          upstream = {
              name: os.environ[variable]
              for name, variable in (
                  ("linux_protocol", "LINUX_RESULT"), ("ios_arm64_cross_build", "IOS_BUILD_RESULT"),
                  ("macho_inspection", "MACHO_RESULT"), ("rootful_package", "PACKAGE_RESULT"),
                  ("p009", "P009_RESULT"), ("p010", "P010_RESULT"),
                  ("p011", "P011_RESULT"), ("p012", "P012_RESULT"),
                  ("p013", "P013_RESULT"), ("p014", "P014_RESULT"),
                  ("p015", "P015_RESULT"), ("p016", "P016_RESULT"),
              )
          }
          if any(result != "success" for result in upstream.values()):
              raise SystemExit("an upstream P009–P016/build CI gate did not succeed")

          suites = {
              "p017_c11_recurrence_dst_conflict_storage": native(
                  "schedule-tests.txt", r"P017 scheduling checks: (\d+) passed", "P017 schedule"
              ),
              "p014_recovery_blocking": native(
                  "p014-tests.txt", r"P014 recovery policy and persistence checks: (\d+) passed", "P014"
              ),
              "p013_lifecycle": native(
                  "p013-native-tests.txt", r"P013 native service checks: (\d+) passed", "P013"
              ),
              "p015_unattended_policy_denial": native(
                  "p015-tests.txt", r"P015 policy/schema/filesystem checks: (\d+) passed", "P015"
              ),
              "p016_unknown_stale_telemetry": native(
                  "p016-tests.txt", r"P016 health/native checks: (\d+) passed", "P016"
              ),
              "p017_cli_storage_and_mutation_previews": python_suite("cli-tests.txt", "P017 CLI"),
              "p016_cli_compatibility": python_suite("p016-cli-tests.txt", "P016 CLI"),
              "p015_cli_compatibility": python_suite("p015-cli-tests.txt", "P015 CLI"),
              "p009_evidence_compatibility": python_suite("p009-tests.txt", "P009"),
              "p011_preflight": python_suite("p011-tests.txt", "P011"),
              "p012_idle_research": python_suite("p012-tests.txt", "P012"),
              "p013_service_cli": python_suite("p013-tests.txt", "P013 CLI"),
              "p010_signing": python_suite("p010-tests.txt", "P010"),
              "rootful_package_regression": python_suite("package-tests.txt", "package"),
              "linux_protocol_and_missed_restart_integration": {"result": "PASS"},
              "no_launchd_or_device_side_effects": {"result": "PASS"},
              "legacy_schedule_preservation": {"result": "PASS"},
          }
          document = {
              "manifest_version": 1,
              "milestone": "P017",
              "status": "P017_CLOUD_COMPLETE_DEVICE_SCHEDULING_PENDING",
              "branch": "ios/p017-scheduling-v2",
              "source_sha": source_sha,
              "validation_class": "SIMULATED_AND_MOCK_ONLY",
              "upstream_gate_results": upstream,
              "suites": suites,
              "schedule_executor": "NOT_AUTHORIZED_BY_P015",
              "legacy_schedule_data": "PRESERVED_SCHEMA_V1_NO_PACKAGE_MIGRATION",
              "legacy_execution_change": "AUTOMATIC_P004_EXECUTION_SUPPRESSED",
              "maximum_new_schedule_seconds": 300,
              "launchd_mutation": "NOT_PERFORMED",
              "real_iokit_assertions": "NOT_ACQUIRED",
              "network_probes": "NOT_PERFORMED",
              "scheduled_wake": "UNVERIFIED",
              "device_acceptance": "PENDING",
          }
          (root / "P017-VALIDATION.json").write_text(
              json.dumps(document, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          lines = [
              f"status={document['status']}",
              f"source_sha={source_sha}",
              f"validation_class={document['validation_class']}",
              f"schedule_executor={document['schedule_executor']}",
              f"legacy_schedule_data={document['legacy_schedule_data']}",
              f"legacy_execution_change={document['legacy_execution_change']}",
              f"launchd_mutation={document['launchd_mutation']}",
              f"real_iokit_assertions={document['real_iokit_assertions']}",
              f"scheduled_wake={document['scheduled_wake']}",
              f"device_acceptance={document['device_acceptance']}",
          ]
          (root / "P017-VALIDATION.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-P017-scheduling-validation
          if-no-files-found: error
          path: |
            build/p017/P017-VALIDATION.json
            build/p017/P017-VALIDATION.txt
            build/p017/source-commit.txt
            build/p017/schedule-tests.txt
            build/p017/cli-tests.txt
            build/p017/integration-tests.txt
            build/p017/p014-tests.txt
            build/p017/p013-native-tests.txt
            build/p017/p015-tests.txt
            build/p017/p016-tests.txt
            build/p017/p016-cli-tests.txt
            build/p017/p015-cli-tests.txt
            build/p017/p009-tests.txt
            build/p017/p011-tests.txt
            build/p017/p012-tests.txt
            build/p017/p013-tests.txt
            build/p017/p010-tests.txt
            build/p017/package-tests.txt

  p018-cli-package-ux-validation:
    name: P018 CLI, package, and evidence validation
    runs-on: ubuntu-latest
    needs:
      - linux-protocol
      - ios-cross-build
      - ios-artifact-inspection
      - ios-rootful-package
      - p009-evidence-validation
      - p011-release-preflight
      - p010-signing-release-gate
      - p012-idle-research-validation
      - p013-launchd-lifecycle-validation
      - p014-crash-recovery-validation
      - p015-server-policy-validation
      - p016-health-telemetry-validation
      - p017-scheduling-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record and verify exact checked-out source SHA
        env:
          P018_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p build/p018
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$P018_SOURCE_SHA"
          printf '%s\n' "$actual_sha" | tee build/p018/source-commit.txt
      - name: Build the explicit C11 mock target
        run: ./scripts/build-linux-test.sh
      - name: Install zsh for interactive-shell syntax validation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh
      - name: Run CLI, error, package-preflight, and evidence-export regressions
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee build/p018/python-tests.txt
          python3 -m unittest discover -s tests/packaging -v 2>&1 | tee build/p018/packaging-tests.txt
          python3 tests/integration.py 2>&1 | tee build/p018/protocol-integration.txt
      - name: Run root-owned export tests in isolated temporary directories
        run: |
          set -euo pipefail
          sudo python3 -m unittest \
            tests.test_p018_export.P018EvidenceInventoryTests.test_opt_in_operator_files_are_untrusted_and_sensitive_ids_are_rejected \
            tests.test_p018_export.P018EvidenceInventoryTests.test_interrupted_export_removes_partial_bundle -v \
            2>&1 | tee build/p018/root-export-tests.txt
      - name: Check POSIX shell and zsh documentation examples
        run: |
          set -euo pipefail
          command -v zsh
          python3 scripts/check_p018_docs_shell.py | tee build/p018/shell-examples.txt
          sh -n packaging/rootful/manager
          sh -n packaging/rootful/DEBIAN/preinst
          sh -n packaging/rootful/DEBIAN/prerm
      - name: Verify P013–P017 and package-script safety gates
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee build/p018/safety-gates.txt
          import re
          from pathlib import Path

          manager = Path("packaging/rootful/manager").read_text()
          preinst = Path("packaging/rootful/DEBIAN/preinst").read_text()
          prerm = Path("packaging/rootful/DEBIAN/prerm").read_text()
          cli = Path("src/cli.c").read_text()
          service = Path("src/service.c").read_text()
          daemon = Path("src/daemon.c").read_text()
          schedule = Path("src/schedule.c").read_text()
          server_policy = Path("src/server_policy.c").read_text()
          forbidden_manager = re.compile(r"\bdpkg\s+(?:-i|--remove)\b|\blaunchctl\s+(?:load|bootstrap|enable|kickstart|start|restart|bootout)\b|\bkill\s+-9\b|\brm\s+-rf\b", re.I)
          for name, text in (("manager", manager), ("preinst", preinst), ("prerm", prerm)):
              if forbidden_manager.search(text):
                  raise SystemExit(f"unsafe package mutation found in {name}")
          doctor = cli.split("static int doctor_command", 1)[1].split("static int package_status_json", 1)[0]
          if any(token in doctor for token in ("power_acquire", "PROBE\\n", "launchctl load", "system(", "execv(")):
              raise SystemExit("read-only doctor contains an acquisition or mutation path")
          for required in ("launchd.mutating_compatibility=UNVERIFIED", "automatic_restart=no",
                           "SCHEDULE_EXECUTOR_NOT_AUTHORIZED", "schedule.execution=BLOCKED_POLICY"):
              source = service + cli + daemon + schedule + server_policy
              if required not in source:
                  raise SystemExit(f"safety gate missing: {required}")
          print("p013_launchd_mutation=UNVERIFIED_FAIL_CLOSED")
          print("p014_automatic_restart=NO")
          print("p015_unattended_execution=NOT_AUTHORIZED")
          print("p017_schedule_executor=NOT_AUTHORIZED")
          print("package_install_remove_rollback=NOT_EXECUTED")
          PY
          test "$(git rev-parse HEAD)" = "$(cat build/p018/source-commit.txt)"
      - name: Exercise real export creation with isolated MOCK-only sources
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/p018-export-test"
          mkdir -p "$tmp/source/scripts" "$tmp/source/docs/evidence" "$tmp/evidence/p011" "$tmp/output"
          cp scripts/p018_evidence.py scripts/p018_validate_export.py "$tmp/source/scripts/"
          cat > "$tmp/source/docs/evidence/P010-OPERATOR-REPORTED.json" <<'JSON'
          {"schema_version":1,"record_type":"p018-export-fixture","evidence_origin":"MOCK","review_status":"UNREVIEWED","fixture_kind":"CI_ONLY","hardware_evidence_accepted":"NOT_ESTABLISHED"}
          JSON
          cat > "$tmp/evidence/p011/package-acceptance.json" <<'JSON'
          {"schema_version":1,"record_type":"p018-export-fixture","evidence_origin":"MOCK","review_status":"UNREVIEWED","fixture_kind":"CI_ONLY","hardware_evidence_accepted":"NOT_ESTABLISHED"}
          JSON
          sudo chown -R root:root "$tmp/source" "$tmp/evidence" "$tmp/output"
          sudo chmod 755 "$tmp/source" "$tmp/source/scripts" "$tmp/source/docs" "$tmp/source/docs/evidence"
          sudo chmod 644 "$tmp/source/scripts/p018_evidence.py" "$tmp/source/scripts/p018_validate_export.py" "$tmp/source/docs/evidence/P010-OPERATOR-REPORTED.json"
          sudo chmod 755 "$tmp/evidence/p011"
          sudo chmod 644 "$tmp/evidence/p011/package-acceptance.json"
          source_sha="$(git rev-parse HEAD)"
          sudo python3 "$tmp/source/scripts/p018_evidence.py" export --output "$tmp/output/bundle" --root "$tmp/evidence" --json | tee build/p018/root-export.json
          sudo python3 "$tmp/source/scripts/p018_validate_export.py" "$tmp/output/bundle" --json | tee build/p018/root-export-validation.json
          grep -q '"hardware_evidence_accepted":"NOT_ESTABLISHED"' build/p018/root-export-validation.json
          sudo grep -q '"provenance":"MOCK"' "$tmp/output/bundle/manifest.json"
          sudo cp -a "$tmp/output/bundle" build/p018/export-created
          sudo chown -R "$(id -u):$(id -g)" build/p018/export-created
          python3 scripts/p018_validate_export.py build/p018/export-created --json | tee build/p018/copied-export-validation.json
          python3 tests/create_p018_fixture_bundle.py --output "$RUNNER_TEMP/p018-deterministic-fixture" --source-sha "$source_sha" | tee build/p018/deterministic-fixture.txt
          python3 scripts/p018_validate_export.py "$RUNNER_TEMP/p018-deterministic-fixture" --json | tee build/p018/deterministic-fixture-validation.json
      - name: Write P018 exact-source validation summary
        env:
          P018_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path("build/p018")
          source_sha = os.environ["P018_SOURCE_SHA"]
          if (root / "source-commit.txt").read_text().strip() != source_sha:
              raise SystemExit("P018 validation artifact SHA mismatch")
          suites = {}
          for key, filename in (("python", "python-tests.txt"),
                                ("packaging", "packaging-tests.txt")):
              text = (root / filename).read_text()
              count = re.search(r"Ran (\d+) tests? in ", text)
              if not count or not re.search(r"^OK(?: \(skipped=\d+\))?$", text, re.MULTILINE):
                  raise SystemExit(f"{key} suite did not pass")
              suites[key] = {"tests": int(count.group(1)), "result": "PASS"}
          summary = {
              "manifest_version": 1,
              "milestone": "P018",
              "source_sha": source_sha,
              "status": "P018_CLOUD_COMPLETE_DEVICE_UX_PENDING",
              "validation_scope": "C11_MOCK_PYTHON_STANDARD_LIBRARY_POSIX_SH_ZSH_SYNTAX",
              "upstream_p009_p017": "PASS",
              "suites": suites,
              "package_install_remove_rollback": "NOT_EXECUTED",
              "launchd_mutation": "NOT_PERFORMED",
              "daemon_start": "NOT_PERFORMED",
              "assertion_acquisition": "NOT_PERFORMED",
              "device_access": "NOT_PERFORMED",
              "export_fixture_provenance": "MOCK_ONLY",
              "hardware_evidence_accepted": "NOT_ESTABLISHED",
          }
          (root / "P018-VALIDATION.json").write_text(
              json.dumps(summary, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-P018-CLI-Package-Evidence-Validation
          if-no-files-found: error
          path: |
            build/p018/source-commit.txt
            build/p018/P018-VALIDATION.json
            build/p018/python-tests.txt
            build/p018/packaging-tests.txt
            build/p018/root-export-tests.txt
            build/p018/protocol-integration.txt
            build/p018/shell-examples.txt
            build/p018/safety-gates.txt
            build/p018/root-export.json
            build/p018/root-export-validation.json
            build/p018/copied-export-validation.json
            build/p018/export-created/**
            build/p018/deterministic-fixture.txt
            build/p018/deterministic-fixture-validation.json

  p019-supervised-reliability-validation:
    name: P019 supervised reliability and acceptance validation
    runs-on: ubuntu-latest
    needs:
      - linux-protocol
      - ios-cross-build
      - ios-artifact-inspection
      - ios-rootful-package
      - p009-evidence-validation
      - p011-release-preflight
      - p010-signing-release-gate
      - p012-idle-research-validation
      - p013-launchd-lifecycle-validation
      - p014-crash-recovery-validation
      - p015-server-policy-validation
      - p016-health-telemetry-validation
      - p017-scheduling-validation
      - p018-cli-package-ux-validation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record and verify exact checked-out source SHA
        env:
          P019_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p build/p019
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$P019_SOURCE_SHA"
          printf '%s\n' "$actual_sha" | tee build/p019/source-commit.txt
      - name: Validate preregistered P019 protocol and strict schemas
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/p019_session.py tests/p019_fixtures.py tests/test_p019_session.py
          python3 scripts/p019_session.py plan --format json > build/p019/plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          import p012_common
          protocol = json.loads(Path("experiments/p019/protocol-v1.json").read_text())
          schema = json.loads(Path("experiments/p019/protocol-v1.schema.json").read_text())
          for path in ("experiments/p019/session-v1.schema.json", "experiments/p019/acceptance-result-v1.schema.json"):
              value = json.loads(Path(path).read_text())
              assert isinstance(value.get("$id"), str), path
          issues = p012_common.validate_json_schema(protocol, schema)
          if issues:
              raise SystemExit("P019 protocol schema failed: " + "; ".join(issues))
          plan = json.loads(Path("build/p019/plan.json").read_text())
          assert plan["cloud_only"] is True and plan["device_actions_started"] is False
          assert plan["p012_matrix"]["planned_probe_trials"] == 24
          assert plan["p012_matrix"]["maximum_hold_seconds"] == 300
          PY
      - name: Run P019 fault, safety, evidence, and side-effect-boundary tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -p 'test_p019_session.py' -v 2>&1 | tee build/p019/p019-tests.txt
      - name: Run P009, P012, and P018 evidence compatibility suites
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_p009_evidence.py' -v 2>&1 | tee build/p019/p009-compatibility-tests.txt
          python3 -m unittest discover -s tests -p 'test_p012_research.py' -v 2>&1 | tee build/p019/p012-compatibility-tests.txt
          python3 -m unittest discover -s tests -p 'test_p018_export.py' -v 2>&1 | tee build/p019/p018-export-compatibility-tests.txt
      - name: Generate and analyze deterministic SIMULATED-only session
        env:
          P019_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tests/create_p019_simulation_artifacts.py --source-sha "$P019_SOURCE_SHA" --output-dir build/p019/simulation
          python3 scripts/p019_session.py validate --session build/p019/simulation/session-simulated.json > build/p019/simulation/validation.json
          python3 scripts/p019_session.py analyze --session build/p019/simulation/session-simulated.json > build/p019/simulation/analysis.json
          python3 scripts/p019_session.py report --session build/p019/simulation/session-simulated.json --format markdown > build/p019/simulation/report.md
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("build/p019/simulation")
          source = os.environ["P019_SOURCE_SHA"]
          session = json.loads((root / "session-simulated.json").read_text())
          validation = json.loads((root / "validation.json").read_text())
          analysis = json.loads((root / "analysis.json").read_text())
          summary = json.loads((root / "SIMULATED-ONLY.json").read_text())
          assert session["source_commit_sha"] == source
          assert session["evidence_class"] == "SIMULATED"
          assert all(row["evidence_origin"] == "SIMULATED" for row in session["trial_records"])
          assert all(row["source_class"] == "SIMULATED" for row in session["bounded_cycles"])
          assert validation["session_validation"] == "PASS"
          assert validation["hardware_acceptance"] == "NOT_ESTABLISHED"
          assert analysis["status"] == "PREREQUISITES_BLOCKED"
          assert analysis["hardware_acceptance"] == "NOT_ESTABLISHED"
          assert analysis["source_commit_sha"] == source
          assert summary["fixture_provenance"] == "SIMULATED"
          assert summary["hardware_acceptance"] == "NOT_ESTABLISHED"
          assert summary["device_actions"] == "NOT_PERFORMED"
          (root / "P019-CI-SUMMARY.json").write_text(json.dumps({
              "manifest_version": 1,
              "milestone": "P019",
              "source_sha": source,
              "cloud_status": "P019_CLOUD_COMPLETE_HARDWARE_ACCEPTANCE_PENDING",
              "fixture_provenance": "SIMULATED_ONLY",
              "simulated_analysis_decision": analysis["status"],
              "hardware_acceptance": "NOT_ESTABLISHED",
              "physical_device_execution": "NOT_PERFORMED",
              "exact_source_sha_verified": True,
          }, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Confirm no device execution and exact source is unchanged
        env:
          P019_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$P019_SOURCE_SHA"
          test "$(cat build/p019/source-commit.txt)" = "$P019_SOURCE_SHA"
          ! rg -n 'DEVICE_REPORTED|EXTERNAL_OBSERVER' build/p019/simulation
          grep -q '"hardware_acceptance": "NOT_ESTABLISHED"' build/p019/simulation/P019-CI-SUMMARY.json
          grep -q '"device_actions": "NOT_PERFORMED"' build/p019/simulation/SIMULATED-ONLY.json
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-Caffeinate-P019-SIMULATED-Cloud-Validation
          if-no-files-found: error
          path: |
            build/p019/source-commit.txt
            build/p019/plan.json
            build/p019/p019-tests.txt
            build/p019/p009-compatibility-tests.txt
            build/p019/p012-compatibility-tests.txt
            build/p019/p018-export-compatibility-tests.txt
            build/p019/simulation/**
